name: Build ADrop Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ADrop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop-v3.2.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADrop-Android-APK
          path: dist/ADrop.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.2.0 --yes || true
          gh release create v3.2.0 dist/ADrop.apk dist/ADrop-v3.2.0.apk \
            --title "ADrop Android v3.2.0" \
            --notes "### Official ADrop Android Client (v3.2.0)
          
          - **Fullscreen Native WebView**: Zero address bar, pure standalone app experience.
          - **Camera QR Scanner**: Point at your PC to connect in 1 second.
          - **Offline LAN File Transfer**: Up to 150+ MB/s direct transfer over WiFi, Hotspot, or USB.
          - **Background WakeLock**: Transfers stay alive even when screen dims.
          - **Native Download Manager**: Files save straight to your phone's Downloads folder with progress notifications."
