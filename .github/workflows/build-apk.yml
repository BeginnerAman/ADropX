name: Build ADrop Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ADrop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop-v3.2.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADrop-Android-APK
          path: dist/ADrop.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.2.5 --yes || true
          gh release create v3.2.5 dist/ADrop.apk \
            --title "ADrop Android v3.2.5" \
            --notes "### Official ADrop Android Client (v3.2.5)
          
          - **In-Place Morphing Circular Download Ring**: Real-time animated SVG progress ring replacing static download button.
          - **Center Pause / Cancel Control**: Direct one-tap cancellation that stops stream and purges partial downloads.
          - **Glowing Checkmark (Tick) Completion**: Instant visual confirmation when file is saved to Downloads.
          - **Live Transfer Speed & Stats**: Real-time throughput (35-40+ MB/s) and percentage display with throttled 200ms updates for zero UI lag.
          - **High-Speed Native Downloader Engine (35-40+ MB/s)**: Bypassed throttled system DownloadManager with direct 128KB buffered native streaming and hardware WifiLock.
          - **External Media Player Bridge**: Stream heavy 4K/MKV movies directly in VLC / MX Player."
