name: Build ADrop Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ADrop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADropX.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADropX-Android-APK
          path: dist/ADropX.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.3.1 --yes || true
          gh release create v3.3.1 dist/ADropX.apk dist/ADrop.apk \
            --title "ADropX Android v3.3.1" \
            --notes "### Official ADropX Android Client (v3.3.1)
          
          - **Rebranded to ADropX**: Next-generation offline high-speed local file transfer.
          - **Unified Native Dialogs**: All system toasts and file pickers branded with ADropX.
          - **Eliminated White Screen Flash**: Immediate dark theme canvas background initialization.
          - **Crisp QR Scan Vibration**: Strict 50ms haptic feedback strictly when connected via QR scan.
          - **HTML5 Video Native Fullscreen**: Enabled WebChromeClient onShowCustomView & onHideCustomView with back navigation.
          - **Instant Video Rendering**: mediaPlaybackRequiresUserGesture set to false for immediate native video decoding.
          - **Tablet Full-Height View**: File list smoothly fills full screen without empty space.
          - **History & Drawer Scroll Guard**: Swipe-refresh locked while browsing transfer history, preventing accidental page reloads.
          - **130dp Intentional Pull Threshold**: Pull-to-refresh requires deliberate pull from top, eliminating accidental triggers while scrolling."
