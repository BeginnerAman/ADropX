name: Build ADrop Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ADrop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop-v3.2.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADrop-Android-APK
          path: dist/ADrop.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.2.7 --yes || true
          gh release create v3.2.7 dist/ADrop.apk \
            --title "ADrop Android v3.2.7" \
            --notes "### Official ADrop Android Client (v3.2.7)
          
          - **Full Wire Download Speed (35-40+ MB/s)**: Restored 128KB zero-overhead stream with THREAD_PRIORITY_MORE_FAVORABLE to eliminate all TCP window stalls and initial delays.
          - **Clean Video Preview**: Pure distraction-free 16:9 player with no overlays or ghost circles, plus dedicated Open button.
          - **1.5s Throttled UI Progress**: Lightweight updates preventing CPU/GPU compositor contention on mobile devices.
          - **Zero-Blinking Live Stats**: In-place text node updates with compact 378/742 MB formatting."
