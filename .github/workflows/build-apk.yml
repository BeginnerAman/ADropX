name: Build ADrop Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ADrop APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ADrop-v3.2.0.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADrop-Android-APK
          path: dist/ADrop.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.2.1 --yes || true
          gh release create v3.2.1 dist/ADrop.apk \
            --title "ADrop Android v3.2.1" \
            --notes "### Official ADrop Android Client (v3.2.1)
          
          - **Auto-Connect**: Automatically connects to your last PC on launch with zero clicks or lag.
          - **System Share Sheet Integration**: Select files/photos in Gallery and choose 'Share via ADrop'.
          - **Frosted Glass Pill Redesign**: Premium dark acrylic UI matching ADrop desktop.
          - **Zero Floating Clutter**: Switched to sleek top-bar Scan button.
          - **Multi-File Persistence**: Retains file selections without timeouts or background drops."
